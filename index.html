    body { box-sizing: border-box; }
    * { font-family: 'Nunito', sans-serif; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    
    .float-animation { animation: float 3s ease-in-out infinite; }
    .shake { animation: shake 0.3s ease-in-out; }
    
    .hint-card {
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .hint-card:hover {
      transform: translateY(-2px);
    }
    
    .guess-input:focus {
      box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.3);
    }
    
    .suggestion-item:hover {
      background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
      color: white;
    }
    
    .leaf-pattern {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 Q35 15 30 25 Q25 15 30 5' fill='%2390caf9' opacity='0.1'/%3E%3C/svg%3E");
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

    // Game State
    let currentVillager = null;
    let hintsRevealed = 0;
    let score = 0;
    let streak = 0;
    let hintOrder = [];
    let gameOver = false;
    let guessHistory = [];

    const allHintTypes = ['gender', 'species', 'personality', 'initial'];

    const hintIcons = {
      gender: '👤',
      species: '🐾',
      personality: '💭',
      initial: '🔤'
    };

    const hintLabels = {
      gender: 'Gender',
      species: 'Species',
      personality: 'Personality',
      initial: 'First Letter'
    };

    // DOM Elements
    const hintsGrid = document.getElementById('hints-grid');
    const hintsCount = document.getElementById('hints-count');
    const hintBtn = document.getElementById('hint-btn');
    const guessInput = document.getElementById('guess-input');
    const suggestions = document.getElementById('suggestions');
    const submitBtn = document.getElementById('submit-btn');
    const resultContainer = document.getElementById('result-container');
    const resultIcon = document.getElementById('result-icon');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const nextBtn = document.getElementById('next-btn');
    const giveupBtn = document.getElementById('giveup-btn');
    const scoreDisplay = document.getElementById('score');
    const streakDisplay = document.getElementById('streak');

    // Initialize game
    function initGame() {
      currentVillager = villagers[Math.floor(Math.random() * villagers.length)];
      hintsRevealed = 0;
      gameOver = false;
      hintOrder = [...allHintTypes];
      guessHistory = [];
      
      renderHints();
      updateHintCount();
      document.getElementById('guesses-container').innerHTML = '';
      guessInput.value = '';
      suggestions.classList.add('hidden');
      resultContainer.classList.add('hidden');
      giveupBtn.classList.remove('hidden');
      hintBtn.disabled = false;
      hintBtn.classList.remove('opacity-50');
    }

    function renderHints() {
      hintsGrid.innerHTML = '';
      
      for (let i = 0; i < 4; i++) {
        const hintType = hintOrder[i];
        const isRevealed = i < hintsRevealed;
        
        const hintCard = document.createElement('div');
        hintCard.className = `hint-card rounded-xl p-3 text-center ${isRevealed ? 'bg-white shadow-md' : 'bg-amber-100'}`;
        
        if (isRevealed) {
          const value = getHintValue(hintType);
          hintCard.innerHTML = `
            <div class="text-2xl mb-1">${hintIcons[hintType]}</div>
            <div class="text-xs text-amber-600 font-semibold uppercase tracking-wide">${hintLabels[hintType]}</div>
            <div class="text-sm font-bold text-green-800 mt-1">${value}</div>
          `;
        } else {
          hintCard.innerHTML = `
            <div class="text-2xl mb-1 opacity-30">❓</div>
            <div class="text-xs text-amber-400 font-semibold">Hidden</div>
          `;
        }
        
        hintsGrid.appendChild(hintCard);
      }
    }

    function getHintValue(type) {
      switch(type) {
        case 'gender': return currentVillager.gender;
        case 'species': return currentVillager.species;
        case 'personality': return currentVillager.personality;
        case 'initial': return currentVillager.name[0].toUpperCase();
        default: return '';
      }
    }

    function updateHintCount() {
      hintsCount.textContent = `${hintsRevealed}/4`;
    }

    function revealHint() {
      if (hintsRevealed < 4 && !gameOver) {
        hintsRevealed++;
        renderHints();
        updateHintCount();
        
        if (hintsRevealed >= 4) {
          hintBtn.disabled = true;
          hintBtn.classList.add('opacity-50');
        }
      }
    }

    function showSuggestions(query) {
      if (!query.trim()) {
        suggestions.classList.add('hidden');
        return;
      }
      
      const matches = villagers
        .filter(v => v.name.toLowerCase().startsWith(query.toLowerCase()))
        .slice(0, 5);
      
      if (matches.length === 0) {
        suggestions.classList.add('hidden');
        return;
      }
      
      suggestions.innerHTML = matches.map(v => `
        <div class="suggestion-item px-4 py-2 cursor-pointer border-b border-gray-100 last:border-0 transition-colors" data-name="${v.name}">
          ${v.name}
        </div>
      `).join('');
      
      suggestions.classList.remove('hidden');
      
      document.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          guessInput.value = item.dataset.name;
          suggestions.classList.add('hidden');
        });
      });
    }

    function checkGuess() {
      const guessText = guessInput.value.trim();
      
      if (!guessText) return;
      
      const guessedVillager = villagers.find(v => v.name.toLowerCase() === guessText.toLowerCase());
      
      if (!guessedVillager) {
        guessInput.classList.add('shake');
        setTimeout(() => guessInput.classList.remove('shake'), 300);
        return;
      }
      
      const isCorrect = guessedVillager.name.toLowerCase() === currentVillager.name.toLowerCase();
      
      guessHistory.push({ villager: guessedVillager, isCorrect });
      renderGuessCard(guessedVillager, isCorrect);
      
      guessInput.value = '';
      suggestions.classList.add('hidden');
      
      if (isCorrect) {
        gameOver = true;
        giveupBtn.classList.add('hidden');
        
        const points = Math.max(100 - (hintsRevealed * 10) - (guessHistory.length * 5), 10);
        score += points;
        streak++;
        
        scoreDisplay.textContent = score;
        streakDisplay.textContent = streak;
        
        resultContainer.style.backgroundColor = '#c8e6c9';
        resultIcon.textContent = '🎉';
        resultTitle.textContent = 'Correct!';
        resultTitle.style.color = '#2e7d32';
        resultMessage.innerHTML = `It was <strong>${currentVillager.name}</strong>!<br>+${points} points (${hintsRevealed} hints, ${guessHistory.length} ${guessHistory.length === 1 ? 'guess' : 'guesses'}) • ${streak} streak 🔥`;
        resultMessage.style.color = '#388e3c';
        
        resultContainer.classList.remove('hidden');
      }
    }
    
    function renderGuessCard(guessedVillager, isCorrect) {
      const container = document.getElementById('guesses-container');
      const card = document.createElement('div');
      card.className = `rounded-xl p-4 shadow-md ${isCorrect ? 'bg-gradient-to-r from-green-100 to-green-200 border-2 border-green-400' : 'bg-white'}`;
      
      const traits = [
        { label: '👤 Gender', value: guessedVillager.gender, match: guessedVillager.gender === currentVillager.gender },
        { label: '🐾 Species', value: guessedVillager.species, match: guessedVillager.species === currentVillager.species },
        { label: '💭 Personality', value: guessedVillager.personality, match: guessedVillager.personality === currentVillager.personality },
        { label: '🔤 First Letter', value: guessedVillager.name[0].toUpperCase(), match: guessedVillager.name[0].toUpperCase() === currentVillager.name[0].toUpperCase() }
      ];
      
      let html = `
        <div class="font-bold text-lg mb-3 ${isCorrect ? 'text-green-800' : 'text-gray-800'}">
          ${isCorrect ? '✅ ' : ''}${guessedVillager.name}
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
      `;
      
      traits.forEach(trait => {
        const bgColor = trait.match ? 'bg-green-500' : 'bg-orange-400';
        html += `
          <div class="${bgColor} rounded-lg p-2 text-white text-center">
            <div class="text-xs font-semibold mb-1">${trait.label}</div>
            <div class="text-sm font-bold">${trait.value}</div>
          </div>
        `;
      });
      
      html += `</div>`;
      card.innerHTML = html;
      
      container.insertBefore(card, container.firstChild);
    }

    function giveUp() {
      gameOver = true;
      streak = 0;
      streakDisplay.textContent = streak;
      giveupBtn.classList.add('hidden');
      
      resultContainer.style.backgroundColor = '#fff3e0';
      resultIcon.textContent = '🤔';
      resultTitle.textContent = 'The answer was...';
      resultTitle.style.color = '#e65100';
      resultMessage.innerHTML = `<strong>${currentVillager.name}</strong>!<br>Better luck next time!`;
      resultMessage.style.color = '#f57c00';
      
      resultContainer.classList.remove('hidden');
    }

    // Event Listeners
    hintBtn.addEventListener('click', revealHint);
    guessInput.addEventListener('input', (e) => showSuggestions(e.target.value));
    guessInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        checkGuess();
      }
    });
    submitBtn.addEventListener('click', checkGuess);
    nextBtn.addEventListener('click', initGame);
    giveupBtn.addEventListener('click', giveUp);

    document.addEventListener('click', (e) => {
      if (!suggestions.contains(e.target) && e.target !== guessInput) {
        suggestions.classList.add('hidden');
      }
    });

    // Element SDK Integration
    async function onConfigChange(cfg) {
      const titleEl = document.getElementById('game-title');
      const instructionsEl = document.getElementById('instructions-text');
      
      titleEl.textContent = cfg.game_title || defaultConfig.game_title;
      instructionsEl.textContent = cfg.instructions_text || defaultConfig.instructions_text;
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map([
        ['game_title', cfg.game_title || defaultConfig.game_title],
        ['instructions_text', cfg.instructions_text || defaultConfig.instructions_text]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    initGame();
