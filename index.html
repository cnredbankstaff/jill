    body { box-sizing: border-box; }
    * { font-family: 'Nunito', sans-serif; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    
    .float-animation { animation: float 3s ease-in-out infinite; }
    .shake { animation: shake 0.3s ease-in-out; }
    
    .hint-card {
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .hint-card:hover {
      transform: translateY(-2px);
    }
    
    .guess-input:focus {
      box-shadow: 0 0 0 3px rgba(139, 195, 74, 0.3);
    }
    
    .suggestion-item:hover {
      background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
      color: white;
    }
    
    .leaf-pattern {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 Q35 15 30 25 Q25 15 30 5' fill='%2390caf9' opacity='0.1'/%3E%3C/svg%3E");
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>

    const allHintTypes = ['gender', 'species', 'personality', 'colors', 'styles', 'hobby', 'zodiac', 'initial'];

    const hintIcons = {
      gender: '👤',
      species: '🐾',
      personality: '💭',
      colors: '🎨',
      styles: '👔',
      hobby: '🎯',
      zodiac: '⭐',
      initial: '🔤'
    };

    const hintLabels = {
      gender: 'Gender',
      species: 'Species',
      personality: 'Personality',
      colors: 'Fav Colors',

    // DOM Elements
    const hintsGrid = document.getElementById('hints-grid');
    const hintsCount = document.getElementById('hints-count');

    const resultIcon = document.getElementById('result-icon');

    const resultMessage = document.getElementById('result-message');

    const scoreDisplay = document.getElementById('score');
    const streakDisplay = document.getElementById('streak');
    const gameTitle = document.getElementById('game-title');

    // Initialize game
    function initGame() {
      currentVillager = villagers[Math.floor(Math.random() * villagers.length)];
      hintsRevealed = 0;
      gameOver = false;
      hintOrder = shuffleArray([...allHintTypes]);
      
      renderHints();
      updateHintCount();
      guessInput.value = '';
      suggestions.classList.add('hidden');
      resultContainer.classList.add('hidden');
      giveupBtn.classList.remove('hidden');
      hintBtn.disabled = false;
      hintBtn.classList.remove('opacity-50');
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderHints() {
      hintsGrid.innerHTML = '';
      
      for (let i = 0; i < 8; i++) {
        const hintType = hintOrder[i];
        const isRevealed = i < hintsRevealed;
        
        const hintCard = document.createElement('div');
        hintCard.className = `hint-card rounded-xl p-3 text-center ${isRevealed ? 'bg-white shadow-md' : 'bg-amber-100'}`;
        
        if (isRevealed) {
          const value = getHintValue(hintType);
          hintCard.innerHTML = `
            <div class="text-2xl mb-1">${hintIcons[hintType]}</div>
            <div class="text-xs text-amber-600 font-semibold uppercase tracking-wide">${hintLabels[hintType]}</div>
            <div class="text-sm font-bold text-green-800 mt-1">${value}</div>
          `;
        } else {
          hintCard.innerHTML = `
            <div class="text-2xl mb-1 opacity-30">❓</div>
            <div class="text-xs text-amber-400 font-semibold">Hidden</div>
          `;
        }
        
        hintsGrid.appendChild(hintCard);
      }
    }

    function getHintValue(type) {
      switch(type) {
        case 'gender': return currentVillager.gender;
        case 'species': return currentVillager.species;
        case 'personality': return currentVillager.personality;
        case 'colors': return currentVillager.colors.join(', ');
        case 'styles': return currentVillager.styles.join(', ');
        case 'hobby': return currentVillager.hobby;
        case 'zodiac': return currentVillager.zodiac;
        case 'initial': return currentVillager.name[0].toUpperCase();
        default: return '';
      }
    }

    function updateHintCount() {
      hintsCount.textContent = `${hintsRevealed}/8`;
    }

    function revealHint() {
      if (hintsRevealed < 8 && !gameOver) {
        hintsRevealed++;
        renderHints();
        updateHintCount();
        
        if (hintsRevealed >= 8) {
          hintBtn.disabled = true;
          hintBtn.classList.add('opacity-50');
        }
      }
    }

    function showSuggestions(query) {
      if (!query.trim()) {
        suggestions.classList.add('hidden');
        return;
      }
      
      const matches = villagers
        .filter(v => v.name.toLowerCase().startsWith(query.toLowerCase()))
        .slice(0, 5);
      
      if (matches.length === 0) {
        suggestions.classList.add('hidden');
        return;
      }
      
      suggestions.innerHTML = matches.map(v => `
        <div class="suggestion-item px-4 py-2 cursor-pointer border-b border-gray-100 last:border-0 transition-colors" data-name="${v.name}">
          ${v.name}
        </div>
      `).join('');
      
      suggestions.classList.remove('hidden');
      
      document.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          guessInput.value = item.dataset.name;
          suggestions.classList.add('hidden');
        });
      });
    }

    function checkGuess() {
      const guess = guessInput.value.trim().toLowerCase();
      const correct = currentVillager.name.toLowerCase();
      
      if (!guess) return;
      
      gameOver = true;
      giveupBtn.classList.add('hidden');
      
      if (guess === correct) {
        // Calculate points based on hints used
        const points = Math.max(100 - (hintsRevealed * 10), 10);
        score += points;
        streak++;
        
        scoreDisplay.textContent = score;
        streakDisplay.textContent = streak;
        
        resultContainer.style.backgroundColor = '#c8e6c9';
        resultIcon.textContent = '🎉';
        resultTitle.textContent = 'Correct!';
        resultTitle.style.color = '#2e7d32';
        resultMessage.innerHTML = `It was <strong>${currentVillager.name}</strong>!<br>+${points} points • ${streak} streak 🔥`;
        resultMessage.style.color = '#388e3c';
      } else {
        streak = 0;
        streakDisplay.textContent = streak;
        
        resultContainer.style.backgroundColor = '#ffcdd2';
        resultIcon.textContent = '😢';
        resultTitle.textContent = 'Not quite...';
        resultTitle.style.color = '#c62828';
        resultMessage.innerHTML = `The answer was <strong>${currentVillager.name}</strong>!`;
        resultMessage.style.color = '#d32f2f';
        
        guessInput.classList.add('shake');
        setTimeout(() => guessInput.classList.remove('shake'), 300);
      }
      
      resultContainer.classList.remove('hidden');
    }

    function giveUp() {
      gameOver = true;
      streak = 0;
      streakDisplay.textContent = streak;
      giveupBtn.classList.add('hidden');
      
      resultContainer.style.backgroundColor = '#fff3e0';
      resultIcon.textContent = '🤔';
      resultTitle.textContent = 'The answer was...';
      resultTitle.style.color = '#e65100';
      resultMessage.innerHTML = `<strong>${currentVillager.name}</strong>!<br>Better luck next time!`;
      resultMessage.style.color = '#f57c00';
      
      resultContainer.classList.remove('hidden');
    }

      if (e.key === 'Enter') {
        e.preventDefault();
        checkGuess();
      }
    });
    submitBtn.addEventListener('click', checkGuess);
    nextBtn.addEventListener('click', initGame);
    giveupBtn.addEventListener('click', giveUp);

      document.querySelectorAll('h1').forEach(el => el.style.fontSize = `${fontSize * 2}px`);
      document.querySelectorAll('h2').forEach(el => el.style.fontSize = `${fontSize * 1.25}px`);
    }

    function adjustColor(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
    }
